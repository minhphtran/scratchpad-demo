<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zeeland, then and now</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css"
    />
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      #map {
        position: absolute;
        inset: 0;
      }
      #panel {
        position: absolute;
        top: 1rem;
        left: 1rem;
        z-index: 1;
        width: 18.5rem;
        max-height: calc(100vh - 2rem);
        overflow-y: auto;
        padding: 0.9rem 1rem 0.8rem;
        border-radius: 0.5rem;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        font-size: 0.8rem;
        line-height: 1.45;
      }
      #panel h1 {
        margin: 0 0 0.5rem;
        font-size: 0.95rem;
      }
      .rule {
        margin: 0.6rem 0 0.4rem;
        padding-top: 0.55rem;
        border-top: 1px solid #e3e3e3;
        color: #888;
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .option {
        padding: 0.5rem 0 0.1rem;
        /* the dimming is the hint for which map the toggle acts on */
        transition: opacity 0.18s ease;
      }
      .option:not(.active) {
        opacity: 0.4;
      }
      .option-name {
        display: flex;
        gap: 0.4rem;
        align-items: baseline;
        cursor: pointer;
      }
      .option-name b {
        font-weight: 600;
      }
      .option-name span {
        color: #666;
        font-size: 0.72rem;
      }
      input[type="range"] {
        width: 100%;
        margin: 0.25rem 0 0;
        cursor: pointer;
      }
      .pct {
        float: right;
        color: #666;
        font-variant-numeric: tabular-nums;
        font-size: 0.72rem;
      }
      #panel[data-hidden="true"] .option {
        opacity: 0.25;
      }

      label.check {
        display: block;
        margin-bottom: 0.15rem;
        cursor: pointer;
      }
      label.check small {
        display: block;
        margin-left: 1.35rem;
        color: #888;
        font-size: 0.68rem;
        line-height: 1.3;
      }
      #transform-row {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        margin-bottom: 0.45rem;
      }
      #transform-row select {
        flex: 1;
        font: inherit;
        font-size: 0.75rem;
        padding: 0.1rem;
      }
      .sub {
        margin: 0.1rem 0 0.4rem 1.35rem;
      }
      .sub[hidden] {
        display: none;
      }

      #status {
        margin-top: 0.55rem;
        padding-top: 0.5rem;
        border-top: 1px solid #e3e3e3;
        color: #777;
        font-size: 0.72rem;
      }
      #status[data-state="error"] {
        color: #b00;
      }
      a {
        color: #06c;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <div id="panel">
      <h1>Zeeland, then and now</h1>

      <label class="check">
        <input type="checkbox" id="visible" checked /> Show historic map
      </label>

      <div class="option active" data-key="1690">
        <label class="option-name">
          <input type="radio" name="active" value="1690" checked />
          <b>1690</b>
          <span>Mortier &middot; <i>Le Comt&eacute; de Zeelande</i></span>
        </label>
        <span class="pct">100%</span>
        <input type="range" min="0" max="100" value="100" />
      </div>

      <div class="option" data-key="1663">
        <label class="option-name">
          <input type="radio" name="active" value="1663" />
          <b>1663</b>
          <span>Schroots &middot; <i>Kaarte van Zeeland</i></span>
        </label>
        <span class="pct">70%</span>
        <input type="range" min="0" max="100" value="70" />
      </div>

      <div class="rule">Inspect</div>

      <div id="transform-row">
        <label for="transform">Transform</label>
        <select id="transform">
          <option value="thinPlateSpline" selected>thinPlateSpline</option>
          <option value="polynomial">polynomial</option>
          <option value="polynomial2">polynomial2</option>
          <option value="helmert">helmert</option>
          <option value="projective">projective</option>
        </select>
      </div>

      <label class="check">
        <input type="checkbox" id="gcps" /> Control points &amp; error
        <small
          >Blue = where a point sits on the scan, pink = where the transform
          puts it. thinPlateSpline fits every point exactly, so switch to
          polynomial to make the errors appear.</small
        >
      </label>

      <label class="check">
        <input type="checkbox" id="mask" /> Mask outline
      </label>

      <label class="check">
        <input type="checkbox" id="grid" /> Warping mesh
      </label>

      <label class="check">
        <input type="checkbox" id="paper" /> Drop paper background
      </label>
      <div class="sub" id="paper-sub" hidden>
        <span class="pct" id="paper-pct">20%</span>
        <input type="range" id="paper-threshold" min="0" max="100" value="20" />
      </div>

      <div id="status">loading&hellip;</div>
    </div>

    <script type="module">
      import maplibregl from 'https://esm.run/maplibre-gl@5.24.0'
      import { WarpedMapLayer } from 'https://esm.run/@allmaps/maplibre@1.0.0-beta.43'

      // paper colour sampled from a blank sea area of each scan; the two
      // sheets are printed on visibly different stock
      const MAPS = {
        1690: { url: './annotation-1690.json', paper: '#d0c0a8' },
        1663: { url: './annotation-1663.json', paper: '#e0c8b0' }
      }

      const $ = (id) => document.getElementById(id)
      const panel = $('panel')
      const statusEl = $('status')
      const showBox = $('visible')

      let active = '1690'

      const map = new maplibregl.Map({
        container: 'map',
        style: 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json',
        center: [3.9, 51.5],
        zoom: 8.2,
        // The Allmaps plugin does not support pitch.
        maxPitch: 0,
        attributionControl: { customAttribution: 'Map images: Rijksmuseum (CC0)' }
      })
      map.addControl(new maplibregl.NavigationControl({ showCompass: false }))

      const eachLayer = (fn) => {
        for (const entry of Object.values(MAPS)) if (entry.layer) fn(entry.layer)
      }

      // Only the active map is ever visible, and only when the master toggle is on.
      function render() {
        const show = showBox.checked
        panel.dataset.hidden = String(!show)

        for (const [key, entry] of Object.entries(MAPS)) {
          const isActive = key === active
          entry.option.classList.toggle('active', isActive)
          entry.layer?.setLayerOptions({ visible: show && isActive })
        }

        const entry = MAPS[active]
        statusEl.textContent = entry.gcpCount
          ? `${entry.gcpCount} control points · ${$('transform').value}`
          : 'loading…'
      }

      function setActive(key) {
        active = key
        MAPS[key].radio.checked = true
        render()
      }

      for (const [key, entry] of Object.entries(MAPS)) {
        const option = document.querySelector(`.option[data-key="${key}"]`)
        entry.option = option
        entry.radio = option.querySelector('input[type=radio]')
        entry.slider = option.querySelector('input[type=range]')
        entry.pct = option.querySelector('.pct')

        entry.radio.addEventListener('change', () => setActive(key))

        entry.slider.addEventListener('input', () => {
          const value = Number(entry.slider.value)
          entry.pct.textContent = `${value}%`
          entry.layer?.setOpacity(value / 100)
          // Touching a slider is also how you pick that map.
          if (active !== key) setActive(key)
          if (!showBox.checked) {
            showBox.checked = true
            render()
          }
        })
      }

      showBox.addEventListener('change', render)

      // --- Allmaps render options -------------------------------------------

      $('transform').addEventListener('change', (event) => {
        eachLayer((layer) => layer.setLayerTransformationType(event.target.value))
        render()
      })

      $('gcps').addEventListener('change', (event) => {
        const on = event.target.checked
        eachLayer((layer) =>
          layer.setLayerOptions({
            renderGcps: on,
            renderTransformedGcps: on,
            renderVectors: on
          })
        )
      })

      $('mask').addEventListener('change', (event) => {
        eachLayer((layer) =>
          layer.setLayerOptions({ renderMask: event.target.checked })
        )
      })

      $('grid').addEventListener('change', (event) => {
        eachLayer((layer) =>
          layer.setLayerOptions({ debugTriangles: event.target.checked })
        )
      })

      // Removing the paper leaves just the engraved linework over the basemap.
      function applyPaper() {
        const on = $('paper').checked
        $('paper-sub').hidden = !on
        const threshold = Number($('paper-threshold').value)
        $('paper-pct').textContent = `${threshold}%`
        for (const entry of Object.values(MAPS)) {
          entry.layer?.setLayerOptions({
            removeColor: on,
            removeColorColor: entry.paper,
            removeColorThreshold: threshold / 100
          })
        }
      }
      $('paper').addEventListener('change', applyPaper)
      $('paper-threshold').addEventListener('input', applyPaper)

      // ----------------------------------------------------------------------

      map.on('load', async () => {
        try {
          let firstBbox = null

          for (const [key, entry] of Object.entries(MAPS)) {
            // Each WarpedMapLayer needs its own id when there is more than one.
            entry.layer = new WarpedMapLayer({ layerId: `warped-${key}` })
            map.addLayer(entry.layer)

            const annotation = await fetch(entry.url).then((res) => {
              if (!res.ok) throw new Error(`${entry.url}: HTTP ${res.status}`)
              return res.json()
            })
            await entry.layer.addGeoreferenceAnnotation(annotation)

            entry.layer.setOpacity(Number(entry.slider.value) / 100)
            entry.gcpCount = annotation.body.features.length

            if (key === active) firstBbox = entry.layer.getBbox()
          }

          render()

          // Fit once on load only -- refitting on every switch would throw away
          // the view you were comparing.
          if (firstBbox) map.fitBounds(firstBbox, { padding: 40, duration: 0 })
        } catch (err) {
          // Most likely cause: opened via file:// so fetch() is blocked.
          statusEl.textContent = err.message
          statusEl.dataset.state = 'error'
          console.error(err)
        }
      })
    </script>
  </body>
</html>
